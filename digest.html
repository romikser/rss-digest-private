<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSS Reader</title>
<style>
:root{--bg:#0f0f0f;--bg2:#141414;--bg3:#1a1a1a;--bg4:#222;--border:rgba(255,255,255,0.08);--text:#e2e2e2;--text2:#999;--text3:#666;--accent:#378ADD;--accent-bg:rgba(55,138,221,0.12);--star:#BA7517;--radius:8px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--font-serif:Georgia,"Times New Roman",serif}
@media(prefers-color-scheme:light){:root{--bg:#f2f1f0;--bg2:#e8e7e5;--bg3:#fff;--bg4:#f8f7f6;--border:rgba(0,0,0,0.09);--text:#111;--text2:#555;--text3:#999;--accent:#185FA5;--accent-bg:rgba(24,95,165,0.1);--star:#854F0B}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column}
#app{display:flex;flex:1;overflow:hidden}
#sidebar{width:220px;flex-shrink:0;background:var(--bg2);border-right:0.5px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#sidebar-scroll{flex:1;overflow-y:auto;padding:8px 0 16px}
#list-pane{width:300px;flex-shrink:0;border-right:0.5px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#reader-pane{flex:1;display:flex;flex-direction:column;overflow:hidden}
.sidebar-section{padding:16px 12px 4px;font-size:10.5px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--text3)}
.nav-item{display:flex;align-items:center;gap:8px;padding:6px 10px;margin:1px 6px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--text2);user-select:none}
.nav-item:hover{background:var(--border);color:var(--text)}
.nav-item.active{background:var(--accent-bg);color:var(--accent)}
.nav-badge{margin-left:auto;font-size:10.5px;font-weight:500;background:var(--bg4);color:var(--text3);border-radius:9px;padding:1px 6px;min-width:20px;text-align:center}
.nav-item.active .nav-badge{background:var(--accent-bg);color:var(--accent)}
.feed-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sidebar-divider{height:0.5px;background:var(--border);margin:8px 14px}
#list-toolbar{padding:9px 12px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0}
#list-title{font-size:13.5px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill-row{display:flex;gap:3px}
.pill{padding:3px 9px;border-radius:99px;font-size:11px;cursor:pointer;background:var(--bg4);color:var(--text2);border:0.5px solid var(--border);user-select:none}
.pill.active{background:var(--accent-bg);color:var(--accent);border-color:transparent}
#list-scroll{flex:1;overflow-y:auto;min-height:0}
#list-empty{padding:48px 20px;text-align:center;font-size:13px;color:var(--text3);display:none}
.article-row{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-bottom:0.5px solid var(--border);cursor:pointer;user-select:none}
.row-content{flex:1;min-width:0}
.row-thumb{width:56px;height:56px;object-fit:cover;border-radius:5px;flex-shrink:0;margin-top:1px}
.article-row:hover{background:var(--bg4)}
.article-row.selected{background:var(--accent-bg)}
.row-top{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.unread-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;transition:opacity .15s}
.article-row.read .unread-dot{opacity:0}
.row-feed{font-size:11px;color:var(--text3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.article-row.selected .row-feed,.article-row.selected .row-date{color:var(--accent);opacity:.7}
.row-date{font-size:11px;color:var(--text3);flex-shrink:0}
.row-title{font-size:13px;font-weight:500;line-height:1.38;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.article-row.selected .row-title{color:var(--accent)}
.row-desc{font-size:11.5px;color:var(--text2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
.article-row.selected .row-desc{color:var(--accent);opacity:.7}
.cluster-badge{font-size:10px;background:rgba(186,117,23,.15);color:var(--star);border-radius:4px;padding:1px 5px;margin-left:4px;font-weight:500}
#list-keyhints{padding:7px 12px;border-top:0.5px solid var(--border);display:flex;gap:12px;flex-wrap:wrap;flex-shrink:0}
.hint{font-size:10.5px;color:var(--text3)}
.hint kbd{display:inline-block;background:var(--bg4);border:0.5px solid var(--border);border-radius:3px;padding:0 4px;font-family:monospace;font-size:10px;color:var(--text2);margin:0 1px}
#above-count{font-size:11px;font-weight:600;color:var(--accent);cursor:pointer;flex-shrink:0;min-width:28px;display:none}
#above-count.visible{display:block}
#reader-toolbar{padding:9px 16px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0}
.icon-btn{background:none;border:0.5px solid transparent;border-radius:6px;cursor:pointer;color:var(--text2);padding:4px 6px;font-size:15px;display:flex;align-items:center;gap:4px}
.icon-btn:hover{background:var(--bg4);color:var(--text);border-color:var(--border)}
.icon-btn.on{color:var(--star)}
#reader-toolbar-right{display:flex;gap:4px;margin-left:auto}
#reader-scroll{flex:1;overflow-y:auto;min-height:0}
#reader-inner{max-width:660px;padding:24px 28px 60px;margin:0 auto}
#reader-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text3);font-size:13px;flex-direction:column;gap:8px}
.reader-meta{font-size:11.5px;color:var(--text3);margin-bottom:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.reader-feed-badge{background:var(--accent-bg);color:var(--accent);font-size:11px;padding:2px 7px;border-radius:4px;font-weight:500}
#reader-title{font-size:22px;font-weight:600;line-height:1.3;margin-bottom:16px}
.reader-summary-block{font-size:13px;background:var(--bg2);border-left:2px solid var(--accent);border-radius:0 6px 6px 0;padding:10px 14px;color:var(--text2);margin-bottom:18px;line-height:1.6}
.reader-summary-label{font-size:10px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
#reader-hero{width:100%;max-height:260px;object-fit:cover;border-radius:var(--radius);margin-bottom:18px;display:block}
#reader-body{font-family:var(--font-serif);font-size:16px;line-height:1.75;color:var(--text2)}
#reader-body p{margin-bottom:1em}
#reader-open-link{margin-top:20px;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--accent);text-decoration:none;border:0.5px solid var(--border);border-radius:6px;padding:7px 12px}
.generated-badge{font-size:11px;color:var(--text3);padding:4px 8px;background:var(--bg4);border-radius:4px;white-space:nowrap}
@keyframes spin{to{transform:rotate(360deg)}}
#search-row{padding:5px 12px;border-bottom:0.5px solid var(--border);flex-shrink:0}
#search-input{width:100%;background:var(--bg4);border:0.5px solid var(--border);border-radius:6px;padding:5px 10px;font-size:12.5px;color:var(--text);outline:none;font-family:var(--font)}
#search-input::placeholder{color:var(--text3)}
#search-input:focus{border-color:var(--accent);background:var(--bg3)}
@media(max-width:900px){#sidebar{display:none}#list-pane{width:280px}}
@media(max-width:600px){#list-pane{width:100%;display:flex}#reader-pane{display:none}#list-pane.hidden{display:none}#reader-pane.visible{display:flex;width:100%}#back-btn{display:flex !important}}
#back-btn{display:none}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-scroll">
      <div class="sidebar-section">Smart views</div>
      <div class="nav-item active" data-view="all" data-label="All articles" onclick="selectView(this)"><span>⊞</span> All articles <span class="nav-badge" id="badge-all">—</span></div>
      <div class="nav-item" data-view="unread" data-label="Unread" onclick="selectView(this)"><span>●</span> Unread <span class="nav-badge" id="badge-unread">—</span></div>
      <div class="nav-item" data-view="starred" data-label="Starred" onclick="selectView(this)"><span>★</span> Starred <span class="nav-badge" id="badge-starred">—</span></div>
      <div class="nav-item" data-view="today" data-label="Today" onclick="selectView(this)"><span>◷</span> Today <span class="nav-badge" id="badge-today">—</span></div>
      <div class="sidebar-divider"></div>
      <div id="feed-list"></div>
    </div>
  </div>
  <div id="list-pane">
    <div id="list-toolbar">
      <span id="above-count" onclick="scrollListTop()" title="Scroll to top"></span>
      <span id="list-title">All articles</span>
      <div class="pill-row">
        <div class="pill active" data-filter="all" onclick="setFilter(this)">All</div>
        <div class="pill" data-filter="unread" onclick="setFilter(this)">Unread</div>
        <div class="pill" data-filter="starred" onclick="setFilter(this)">Starred</div>
      </div>
    </div>
    <div id="search-row"><input id="search-input" type="search" placeholder="Search articles…" oninput="onSearch(event)"></div>
    <div id="list-scroll"><div id="list-empty">No articles</div></div>
    <div id="list-keyhints">
      <span class="hint"><kbd>j</kbd><kbd>k</kbd> navigate</span>
      <span class="hint"><kbd>u</kbd> unread</span>
      <span class="hint"><kbd>s</kbd> star</span>
      <span class="hint"><kbd>o</kbd> open</span>
      <span class="hint"><kbd>/</kbd> search</span>
    </div>
  </div>
  <div id="reader-pane">
    <div id="reader-toolbar">
      <button class="icon-btn" id="back-btn" onclick="showList()" title="Back to list">←</button>
      <button class="icon-btn" onclick="nav(-1)">↑</button>
      <button class="icon-btn" onclick="nav(1)">↓</button>
      <div id="reader-toolbar-right">
        <button class="icon-btn" id="btn-star" onclick="toggleStar()">☆</button>
        <button class="icon-btn" id="btn-unread" onclick="toggleUnread()">◎</button>
        <button class="icon-btn" onclick="markAllRead()">✓ All read</button>
        <a class="icon-btn" href="http://127.0.0.1:18789/plugins/rss-digest/refresh" target="_blank" rel="noopener" title="Fetch new articles">↻</a>
      </div>
    </div>
    <div id="reader-scroll">
      <div id="reader-empty">
        <span>Select an article</span>
        <span class="generated-badge" id="gen-badge"></span>
      </div>
      <div id="reader-inner" style="display:none"></div>
    </div>
  </div>
</div>

allows small business owners and other merchants to accept contactless payments on an iPhone, with no point-of-sale hardware required. The feature allows customers to pay by simply tapping their iPhone or Apple Watch, credit card or debit card, or other contactless payment option on the merchant's iPhone. Payment is securely completed using NFC, like Apple Pay. Some of Apple's retail employees have been provided with iPhone 14","imageUrl":"images/2eb4d93a4acef0992b73.jpg","author":"Joe Rossignol","clusterSize":1},{"id":"bbf139a64eef30cd","feedUrl":"http://www.macrumors.com/macrumors.xml","feedTitle":"MacRumors: Mac News and Rumors - Front Page","title":"Apple's M7 Ultra Chip Designed to Match a 2019 Mac Pro Feat","url":"https://www.macrumors.com/2026/07/12/m7-ultra-chip-may-match-2019-mac-pro-feat/","publishedAt":1783871590000,"description":"Apple's M7 Ultra chip coming in 2028 is designed to support up to 1.5TB of unified memory, according to Bloomberg 's Mark Gurman . However, whether such a configuration is offered may depend on the state of the ongoing memory chip shortage. In 2019, Apple released an Intel-based Mac Pro with up to 1.5TB RAM . This article, \" Apple's M7 Ultra Chip Designed to Match a 2019 Mac Pro Feat \" first appeared on MacRumors.com Discuss this article in our forums","imageUrl":"https://images.macrumors.com/article-new/2023/01/Mac-Pro-Feature-Teal.jpg","author":"Joe Rossignol","clusterSize":2},{"id":"c30589c08e8262bd","feedUrl":"http://9to5mac.com/feed/","feedTitle":"9to5Mac","title":"M7 Ultra to potentially feature up to 1.5TB of RAM, finally matching 2019 Mac Pro: report","url":"https://9to5mac.com/2026/07/12/m7-ultra-mac-studio-to-support-up-to-1-5-tb-unified-memory/","publishedAt":1783866868000,"description":"According to the latest Power On newsletter from Mark Gurman, Apple is preparing to include up to 1.5TB of RAM in the upcoming M7 Ultra chip. This’ll mean Apple Silicon will finally match the highest RAM configuration available on t :"Gurman: Apple’s ‘Back to School’ deal for U.S. students likely launching later this week","url":"https://9to5mac.com/2026/07/12/gurman-apples-back-to-school-deal-for-u-s-students-likely-launching-later-this-week/","publishedAt":1783865063000,"description":"Every year, Apple has a ‘Back to School’ promo for students – offering some kind of special incentive if they buy a Mac or iPad during the promotional window. Typically, this has come in the form of free accessories (like AirPods), or a $100-150 Apple gift card. According to Bloomberg’s Mark Gurman, the offer should be returning later this week.","imageUrl":"https://9to5mac.com/wp-content/uploads/sites/6/2025/06/back-to-school-2025.jpg?quality=82&#038;strip=all&#038;w=1600","author":"Michael Burkhardt","clusterSize":2},{"id":"d3941fe78db0633d","feedUrl":"https://dev.to/feed/tag/sql","feedTitle":"DEV Community: sql","title":"PostgreSQL 42P11 Error: Causes and Solutions Complete Guide","url":"https://dev.to/dbmserror/postgresql-42p11-error-causes-and-solutions-complete-guide-26l6","publishedAt":1783922582000,"description":"<h2> PostgreSQL Error 42P11: Invalid Cursor Definition </h2> <p>PostgreSQL error code <code>42P11</code> indicates an <strong>invalid cursor definition</strong>, meaning the cursor you declared contains a query or option combination that PostgreSQL cannot accept. This typically occurs inside PL/pgSQL functions or procedures when the cursor's associated query violates PostgreSQL's cursor rules. Understanding the exact constraints on cursor declarations will save you significant debugging time.</p","author":"umzzil nng","clusterSize":4},{"id":"71333298ff91450f","feedUrl":"https://dev.to/feed/tag/sql","feedTitle":"DEV Community: sql","title":"Oracle ORA-01426 Error: Causes and Solutions Complete Guide","url":"https://dev.to/dbmserror/oracle-ora-01426-error-causes-and-solutions-complete-guide-58h6","publishedAt":1783922492000,"description":"<h2> ORA-01426: Numeric Overflow – Causes, Fixes, and Prevention </h2> <p>ORA-01426 occurs in Oracle Database when the result of a numeric operation exceeds the maximum range that the target data type can store. Oracle's NUMBER type supports up to 38 digits of precision, and any arithmetic result or value that surpasses this limit triggers this error. It commonly appears during batch jobs, complex aggregations, or when loading external data with unexpectedly large values.</p> <h2> Top 3 Causes <","author":"umzzil nng","clusterSize":4},{"id":"875a9865c32ae12f","feedUrl":"https://dev.to/feed/tag/sql","feedTitle":"DEV Community: sql","title":"PostgreSQL 42611 Error: Causes and Solutions Complete Guide","url":"https://dev.to/dbmserror/postgresql-42611-error-causes-and-solutions-complete-guide-257d","publishedAt":1783900995000,"description":"<h2> PostgreSQL Error 42611: invalid_column_definition </h2> <p>PostgreSQL error code <strong>42611</strong> (<code>invalid_column_definition</code>) is raised when a column definition in a <code>CREATE TABLE</code>, <code>ALTER TABLE</code>, or composite type statement contains invalid syntax, an unsupported data type, or an illegal combination of constraints. This error is common during database migrations from other RDBMS platforms or when developers use incorrect PostgreSQL syntax. Identifyi","author":"umzzil nng","clusterSize":4},{"id":"733ba1d62b336b51","feedUrl":"https://dev.to/feed/tag/sql","feedTitle":"DEV Community: sql","title":"Oracle ORA-01424 Error: Causes and Solutions Complete Guide","url":"https://dev.to/dbmserror/oracle-ora-01424-error-causes-and-solutions-complete-guide-43gd","publishedAt":1783900895000,"description":"<h2> ORA-01424: Missing or Illegal Character Following the Escape Character </h2> <p>ORA-01424 occurs in Oracle when you use the <code>ESCAPE</code> clause with a <code>LIKE</code> predicate and the character immediately following the designated escape character is either missing or not one of the allowed characters (<code>%</code>, <code>_</code>, or the escape character itself). This error is especially common in applications that build SQL dynamically from user input without properly sanitizi","author":"umzzil nng","clusterSize":4},{"id":"34824a1401101fb0","feedUrl":"https://dev.to/feed/tag/sql","feedTitle":"DEV Community: sql","title":"Turn JSON into SQL INSERT Statements (without writing a script)","url":"https://dev.to/jsonviewertool/turn-json-into-sql-insert-statements-without-writing-a-script-45p4","publishedAt":1783920180000,"description":"<p>You've got a JSON array and you need it as rows in a database. Here's how to turn JSON into SQL <code>INSERT</code> statements — the quick path, the scripted path, and the gotchas that corrupt your data.</p> <h2> The shape that maps cleanly </h2> <p>A flat array of objects maps 1:1 to table rows:<br> </p> <div class=\"highlight js-code-highlight\"> <pre class=\"highlight json\"><code><span class=\"p\">[</span><span class=\"w\"> </span><span class=\"p\">{</span><span class=\"nl\">\"id\"</span><span class=\"p","author":"Avinash Verma","clusterSize":1},{"id":"fdd06d224210ba9f","feedUrl":"https://dev.to/feed/tag/sql","feedTitle":"DEV Community: sql","title":"SQL: JOIN Queries","url":"https://dev.to/yuripeixinho/sql-join-queries-2a5n","publishedAt":1783905169000,"description":"<h1> Introdução </h1> <p>Bancos de dados relacionais distribuem informações em múltiplas tabelas de propósito — para evitar redundância e garantir integridade. Mas na hora de consultar, frequentemente precisamos de dados que estão espalhados por duas ou mais tabelas. É aí que entram os&nbsp;<strong>JOINs</strong>: operações que combinam linhas de tabelas distintas com base em uma condição de correspondência.</p> <p>Para todos os exemplos, usaremos estas duas tabelas:<br> </p> <div class=\"highlig","author":"Yuri Peixinho","clusterSize":5},{"id":"237c7e3f56b0d963","feedUrl":"https://dev.to/feed/tag/sql","feedTitle":"DEV Community: sql","title":"SQL: Data Constraints","url":"https://dev.to/yuripeixinho/sql-data-constraints-4gdh","publishedAt":1783901621000,"description":"<h1> Introdução </h1> <p>Validar dados é uma responsabilidade que pode ficar na aplicação, no banco de dados, ou em ambos. Deixar tudo na aplicação é arriscado: diferentes sistemas podem acessar o mesmo banco, migrações podem rodar diretamente, um bug pode deixar passar um valor inválido.&nbsp;<strong>Constraints</strong>&nbsp;são regras definidas no próprio banco de dados — uma camada de proteção que age independente de quem está escrevendo os dados.</p> <h2> <strong>PRIMARY KEY</strong> </h2> ","author":"Yuri Peixinho","clusterSize":5},{"id":"cb8d98c5be5e580a","feedUrl":"https://dev.to/feed/tag/sql","feedTitle":"DEV Community: sql","title":"Data Manipulation Language (DML)","url":"https://dev.to/yuripeixinho/data-manipulation-language-dml-2eh6","publishedAt":1783898117000,"description":"<h1> Introdução </h1> <p>DML é o conjunto de comandos que os usuários e aplicações usam no dia a dia:&nbsp;<strong>consultar, inserir, atualizar e deletar dados</strong>. Se o DDL define o esquema, o DML é o que acontece dentro dele ao longo de toda a vida do sistema.</p> <h3> <strong>SELECT</strong> </h3> <p>O comando mais usado em SQL. Consulta dados de uma ou mais tabelas.<br> </p> <div class=\"highlight js-code-highlight\"> <pre class=\"highlight sql\"><code><span class=\"k\">SELECT</span> <span c","author":"Yuri Peixinho","clusterSize":5},{"id":"e4fef144418b61fe","feedUrl":"https://dev.to/feed/tag/sql","feedTitle":"DEV Community: sql","title":"Data Definition Language (DDL)","url":"https://dev.to/yuripeixinho/data-definition-language-ddl-o5g","publishedAt":1783898102000,"description":"<h1> Introdução </h1> <p>DDL é o conjunto de comandos responsável por&nbsp;<strong>definir e modificar a estrutura</strong>&nbsp;do banco de dados: criar tabelas, alterar colunas, remover objetos. Operações DDL geralmente são irreversíveis — um&nbsp;<code>DROP TABLE</code>&nbsp;não pede confirmação, ele simplesmente executa.</p> <h3> <strong>CREATE TABLE</strong> </h3> <p>Cria uma nova tabela com suas colunas, tipos de dados e restrições.<br> </p> <div class=\"highlight js-code-highlight\"> <pre c","author":"Yuri Peixinho","clusterSize":5},{"id":"2d6cd77c7334e270","feedUrl":"https://dev.to/feed/tag/sql","feedTitle":"DEV Community: sql","title":"SQL Keyword, Tipos de Dados & Operators","url":"https://dev.to/yuripeixinho/sql-keyword-tipos-de-dados-operators-2a1c","publishedAt":1783895078000,"description":"<h1> Introdução </h1> <p>Keywords são as palavras reservadas da linguagem, termos com significado especial que o banco de dados reconhece e interpreta. Elas formam a espinha dorsal de qualquer instrução SQL.</p> <p>Por convenção, keywords são escritas em&nbsp;<strong>maiúsculas</strong>, embora o SQL seja case-insensitive.&nbsp;<code>select</code>&nbsp;funciona igual a&nbsp;<code>SELECT</code>, mas o uso de maiúsculas é uma convenção amplamente adotada que melhora a legibilidade, deixando claro ","author":"Yuri Peixinho","clusterSize":5},{"id":"a453eee545f6d2f9","feedUrl":"https://dev.to/feed/tag/sql","feedTitle":"DEV Community: sql","title":"SQL: Aggregate Queries","url":"https://dev.to/yuripeixinho/sql-aggregate-queries-59h9","publishedAt":1783901279000,"description":"<h1> Introdução </h1> <p>Consultas individuais respondem perguntas como \"qual o email do cliente 42?\". Mas as perguntas mais valiosas em qualquer sistema são de outro tipo: \"qual o produto mais vendido?\", \"qual a receita média por pedido?\", \"quantos clientes se cadastraram esse mês?\". Para responder isso, o SQL oferece as&nbsp;<strong>funções de agregação</strong>&nbsp;— operações que recebem um conjunto de linhas e devolvem um único valor resumido.</p> <p>Para os exemplos a seguir, considere es","author":"Yuri Peixinho","clusterSize":2},{"id":"b504cf95f54ebd8c","feedUrl":"https://dev.to/feed/tag/sql","feedTitle":"DEV Community: sql","title":"SQL: Normalização e Formas Normais","url":"https://dev.to/yuripeixinho/sql-normalizacao-e-formas-normais-3e5j","publishedAt":1783898152000,"description":"<h1> Introdução </h1> <p>Imagine uma planilha onde cada linha de um pedido guarda também o nome do cliente, o email, a cidade, o nome do produto e a categoria — tudo junto. Funciona no começo. Mas conforme o sistema cresce, começam a aparecer problemas silenciosos: dados duplicados, inconsistências difíceis de rastrear, operações que quebram coisas inesperadas. A normalização existe para eliminar esses problemas sistematicamente.</p> <p>Proposta por Codd nos anos 1970 e formalizada ao longo das ","author":"Yuri Peixinho","clusterSize":2},{"id":"64d3a7ad1c2a170a","feedUrl":"http://feeds2.feedburner.com/thenextweb","feedTitle":"The Next Web","title":"Ubisoft is in crisis, and a 13-year-old pirate game is part of the escape plan","url":"https://thenextweb.com/news/ubisoft-black-flag-remake-nostalgia-business","publishedAt":1783870485000,"description":"Ubisoft has remade the best-loved game in its biggest franchise. Assassin’s Creed Black Flag Resynced arrives 13 years after the original, and the BBC found it largely worth the wait. The Caribbean looks spectacular now. New underwater sections and coral reefs show off what modern hardware can do with a setting that was always the game’s […] This story continues at The Next Web","imageUrl":"images/882d19b9042a0ab77184.avif","author":"Darius Popa","clusterSize":1},{"id":"9cbf88f09bcd48e8","feedUrl":"https://daringfireball.net/feeds/main","feedTitle":"Daring Fireball","title":"Paulo Andrade: ‘A WWDC 27 Update on Building a Mac-Assed App With SwiftUI’","url":"https://pfandrade.me/blog/swiftui-mac-assed-wwdc27-update/","publishedAt":1783891104000,"description":"Paulo Andrade: My last post on using SwiftUI to build a Mac-assed app got a bit more traction than I expected. It was mentioned on Mastodon several times , included in iOS Dev Weekly , inspired May’s edition of the Swift Blog Carnival , and was eventually mentioned by John Gruber , arguably the   const f = ALL_FEEDS.find(x=>x.url===state.feedUrl);
  document.getElementById('list-title').textContent = f?.feedTitle||'Feed';
  state.search = ''; const si2=document.getElementById('search-input'); if(si2) si2.value='';
  if (isMobile()) showList();
  applyView();
}
function setFilter(el) {
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  state.filter = el.dataset.filter;
  applyView();
}
let _st=null;
function onSearch(e) {
  state.search = e.target.value;
  clearTimeout(_st); _st = setTimeout(applyView, 250);
}

function applyView() {
  let list = [...ALL_ARTICLES];
  if (state.feedUrl) list = list.filter(a=>a.feedUrl===state.feedUrl);
  const now = Date.now(), todayCutoff = now - 86400000;
  if (state.view==='unread') list=list.filter(a=>!isRead(a.id));
  else if (state.view==='starred') list=list.filter(a=>isStarred(a.id));
  else if (state.view==='today') list=list.filter(a=>(a.publishedAt||0)>=todayCutoff);
  if (state.filter==='unread') list=list.filter(a=>!isRead(a.id));
  else if (state.filter==='starred') list=list.filter(a=>isStarred(a.id));
  if (state.search) {
    const q = state.search.toLowerCase();
    list = list.filter(a => a.title.toLowerCase().includes(q) || a.feedTitle.toLowerCase().includes(q) || (a.description||'').toLowerCase().includes(q));
  }
  list.sort((a,b)=>(b.publishedAt||0)-(a.publishedAt||0));
  state.visible = list;
  renderList();
}

const PAGE_SIZE = 50;
let listPage = 1;

function renderList() {
  listPage = 1;
  if (_observer) { _observer.disconnect(); _observer = null; }
  renderListPage(true);
}

function renderListPage(reset) {
  const scroll = document.getElementById('list-scroll');
  const empty = document.getElementById('list-empty');
  if (reset) scroll.querySelectorAll('.article-row,#scroll-sentinel').forEach(e=>e.remove());
  const batch = reset
    ? state.visible.slice(0, listPage * PAGE_SIZE)
    : state.visible.slice((listPage - 1) * PAGE_SIZE, listPage * PAGE_SIZE);
  if (reset && batch.length === 0) { empty.style.display='block'; return; }
  empty.style.display='none';
  const frag = document.createDocumentFragment();
  for (const a of batch) {
    const div = document.createElement('div');
    div.className='article-row'+(isRead(a.id)?' read':'')+(a.id===state.selected?' selected':'');
    div.dataset.id=a.id;
    div.innerHTML='<div class="row-content"><div class="row-top"><div class="unread-dot"></div><div class="row-feed">'+esc(a.feedTitle)+'</div><div class="row-date">'+relTime(a.publishedAt)+'</div></div>'
      +'<div class="row-title">'+esc(a.title)+(a.clusterSize>1?'<span class="cluster-badge">'+a.clusterSize+' sources</span>':'')+'</div>'
      +(a.description?'<div class="row-desc">'+esc(a.description)+'</div>':'')+'</div>'
      +(a.imageUrl?'<img class="row-thumb" src="'+esc(a.imageUrl)+'" alt="" loading="lazy" onerror="this.remove()">':'');
    div.onclick=()=>open(a.id);
    frag.appendChild(div);
  }
  // Remove old sentinel before appending new rows
  scroll.querySelector('#scroll-sentinel')?.remove();
  scroll.appendChild(frag);
  if (reset && !_bootRestored) { _bootRestored = true; restoreScrollAnchor(); }
  // Attach infinite-scroll sentinel if more pages remain
  if (state.visible.length > listPage * PAGE_SIZE) {
    const sentinel = document.createElement('div');
    sentinel.id = 'scroll-sentinel';
    sentinel.style.height = '1px';
    scroll.appendChild(sentinel);
    if (_observer) _observer.disconnect();
    _observer = new IntersectionObserver(([e]) => {
      if (!e.isIntersecting || _loadingMore) return;
      _loadingMore = true;
      listPage++;
      renderListPage(false);
      _loadingMore = false;
    }, { root: scroll, rootMargin: '400px' });
    _observer.observe(sentinel);
  }
}

function updateAboveCount() {
  const sc = document.getElementById('list-scroll');
  const el = document.getElementById('above-count');
  if (!sc || !el) return;
  const top = sc.getBoundingClientRect().top;
  let count = 0;
  for (const row of sc.querySelectorAll('.article-row')) {
    if (row.getBoundingClientRect().bottom < top) count++;
    else break;
  }
  el.textContent = count > 0 ? '↑ ' + count : '';
  el.classList.toggle('visible', count > 0);
}

function scrollListTop() {
  document.getElementById('list-scroll').scrollTo({ top: 0, behavior: 'smooth' });
}

function open(id) {
  document.getElementById('list-pane').classList.add('hidden');
  document.getElementById('reader-pane').classList.add('visible');
  state.selected = id;
  document.querySelectorAll('.article-row').forEach(r=>r.classList.toggle('selected',r.dataset.id===id));
  const row=document.querySelector('.article-row[data-id="'+id+'"]');
  if (row) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  if (!isRead(id)) {
    setRead(id,true);
    if (row) row.classList.add('read');
    renderSidebar();
  }
  saveScrollAnchor(id);
  const a = ALL_ARTICLES.find(x=>x.id===id);
  if (a) renderReader(a);
}

function renderReader(a) {
  document.getElementById('btn-star').textContent = isStarred(a.id)?'★':'☆';
  document.getElementById('btn-star').classList.toggle('on',isStarred(a.id));
  let html='<div class="reader-meta"><span class="reader-feed-badge">'+esc(a.feedTitle)+'</span><span>'+relTime(a.publishedAt)+'</span></div>';
  html+='<div id="reader-title">'+esc(a.title)+'</div>';
  if (a.ollamaSummary) html+='<div class="reader-summary-block"><div class="reader-summary-label">AI summary</div>'+esc(a.ollamaSummary)+'</div>';
  if (a.imageUrl) html+='<img id="reader-hero" src="'+esc(a.imageUrl)+'" alt="" onerror="this.remove()">';
  if (a.description) html+='<div id="reader-body"><p>'+esc(a.description)+'</p></div>';
  html+='<a id="reader-open-link" href="'+esc(a.url)+'" target="_blank" rel="noopener">Open original ↗</a>';
  document.getElementById('reader-empty').style.display='none';
  const inner=document.getElementById('reader-inner');
  inner.innerHTML=html; inner.style.display='block';
  document.getElementById('reader-scroll').scrollTop=0;
}

function nav(dir) {
  const idx=state.visible.findIndex(a=>a.id===state.selected);
  const next=state.visible[idx+dir];
  if (next) open(next.id);
}
function toggleStar() {
  const a=ALL_ARTICLES.find(x=>x.id===state.selected); if(!a) return;
  setStar(a.id,!isStarred(a.id));
  document.getElementById('btn-star').textContent=isStarred(a.id)?'★':'☆';
  document.getElementById('btn-star').classList.toggle('on',isStarred(a.id));
  renderSidebar();
}
function toggleUnread() {
  if(!state.selected) return;
  const wasRead=isRead(state.selected);
  setRead(state.selected,!wasRead);
  const row=document.querySelector('.article-row[data-id="'+state.selected+'"]');
  if(row) row.classList.toggle('read',!wasRead);
  renderSidebar();
}
function markAllRead() {
  for (const a of state.visible) setRead(a.id,true);
  document.querySelectorAll('.article-row').forEach(r=>r.classList.add('read'));
  renderSidebar();
}
function showList() {
  document.getElementById('list-pane').classList.remove('hidden');
  document.getElementById('reader-pane').classList.remove('visible');
}

document.addEventListener('keydown', e=>{
  if (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if(e.key==='j') nav(1);
  else if(e.key==='k') nav(-1);
  else if(e.key==='u') toggleUnread();
  else if(e.key==='s') toggleStar();
  else if(e.key==='Escape') { if(isMobile()) showList(); }
  else if(e.key==='/') { e.preventDefault(); const si=document.getElementById('search-input'); if(si){si.focus();si.select();} }
  else if(e.key==='o'&&state.selected) {
    const a=ALL_ARTICLES.find(x=>x.id===state.selected);
    if(a) window.open(a.url,'_blank','noopener');
  }
});

boot();
</script>
</body>
</html>
