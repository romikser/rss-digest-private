<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSS Reader</title>
<style>
:root{--bg:#0f0f0f;--bg2:#141414;--bg3:#1a1a1a;--bg4:#222;--border:rgba(255,255,255,0.08);--text:#e2e2e2;--text2:#999;--text3:#666;--accent:#378ADD;--accent-bg:rgba(55,138,221,0.12);--star:#BA7517;--radius:8px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;--font-serif:Georgia,"Times New Roman",serif}
@media(prefers-color-scheme:light){:root{--bg:#f2f1f0;--bg2:#e8e7e5;--bg3:#fff;--bg4:#f8f7f6;--border:rgba(0,0,0,0.09);--text:#111;--text2:#555;--text3:#999;--accent:#185FA5;--accent-bg:rgba(24,95,165,0.1);--star:#854F0B}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex;flex-direction:column}
#app{display:flex;flex:1;overflow:hidden}
#sidebar{width:220px;flex-shrink:0;background:var(--bg2);border-right:0.5px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#sidebar-scroll{flex:1;overflow-y:auto;padding:8px 0 16px}
#list-pane{width:300px;flex-shrink:0;border-right:0.5px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#reader-pane{flex:1;display:flex;flex-direction:column;overflow:hidden}
.sidebar-section{padding:16px 12px 4px;font-size:10.5px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--text3)}
.nav-item{display:flex;align-items:center;gap:8px;padding:6px 10px;margin:1px 6px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--text2);user-select:none}
.nav-item:hover{background:var(--border);color:var(--text)}
.nav-item.active{background:var(--accent-bg);color:var(--accent)}
.nav-badge{margin-left:auto;font-size:10.5px;font-weight:500;background:var(--bg4);color:var(--text3);border-radius:9px;padding:1px 6px;min-width:20px;text-align:center}
.nav-item.active .nav-badge{background:var(--accent-bg);color:var(--accent)}
.feed-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sidebar-divider{height:0.5px;background:var(--border);margin:8px 14px}
#list-toolbar{padding:9px 12px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0}
#list-title{font-size:13.5px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill-row{display:flex;gap:3px}
.pill{padding:3px 9px;border-radius:99px;font-size:11px;cursor:pointer;background:var(--bg4);color:var(--text2);border:0.5px solid var(--border);user-select:none}
.pill.active{background:var(--accent-bg);color:var(--accent);border-color:transparent}
#list-scroll{flex:1;overflow-y:auto;min-height:0}
#list-empty{padding:48px 20px;text-align:center;font-size:13px;color:var(--text3);display:none}
.article-row{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-bottom:0.5px solid var(--border);cursor:pointer;user-select:none}
.row-content{flex:1;min-width:0}
.row-thumb{width:56px;height:56px;object-fit:cover;border-radius:5px;flex-shrink:0;margin-top:1px}
.article-row:hover{background:var(--bg4)}
.article-row.selected{background:var(--accent-bg)}
.row-top{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.unread-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;transition:opacity .15s}
.article-row.read .unread-dot{opacity:0}
.row-feed{font-size:11px;color:var(--text3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.article-row.selected .row-feed,.article-row.selected .row-date{color:var(--accent);opacity:.7}
.row-date{font-size:11px;color:var(--text3);flex-shrink:0}
.row-title{font-size:13px;font-weight:500;line-height:1.38;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.article-row.selected .row-title{color:var(--accent)}
.row-desc{font-size:11.5px;color:var(--text2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
.article-row.selected .row-desc{color:var(--accent);opacity:.7}
.cluster-badge{font-size:10px;background:rgba(186,117,23,.15);color:var(--star);border-radius:4px;padding:1px 5px;margin-left:4px;font-weight:500}
#list-keyhints{padding:7px 12px;border-top:0.5px solid var(--border);display:flex;gap:12px;flex-wrap:wrap;flex-shrink:0}
.hint{font-size:10.5px;color:var(--text3)}
.hint kbd{display:inline-block;background:var(--bg4);border:0.5px solid var(--border);border-radius:3px;padding:0 4px;font-family:monospace;font-size:10px;color:var(--text2);margin:0 1px}
#above-count{font-size:11px;font-weight:600;color:var(--accent);cursor:pointer;flex-shrink:0;min-width:28px;display:none}
#above-count.visible{display:block}
#reader-toolbar{padding:9px 16px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0}
.icon-btn{background:none;border:0.5px solid transparent;border-radius:6px;cursor:pointer;color:var(--text2);padding:4px 6px;font-size:15px;display:flex;align-items:center;gap:4px}
.icon-btn:hover{background:var(--bg4);color:var(--text);border-color:var(--border)}
.icon-btn.on{color:var(--star)}
#reader-toolbar-right{display:flex;gap:4px;margin-left:auto}
#reader-scroll{flex:1;overflow-y:auto;min-height:0}
#reader-inner{max-width:660px;padding:24px 28px 60px;margin:0 auto}
#reader-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--text3);font-size:13px;flex-direction:column;gap:8px}
.reader-meta{font-size:11.5px;color:var(--text3);margin-bottom:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.reader-feed-badge{background:var(--accent-bg);color:var(--accent);font-size:11px;padding:2px 7px;border-radius:4px;font-weight:500}
#reader-title{font-size:22px;font-weight:600;line-height:1.3;margin-bottom:16px}
.reader-summary-block{font-size:13px;background:var(--bg2);border-left:2px solid var(--accent);border-radius:0 6px 6px 0;padding:10px 14px;color:var(--text2);margin-bottom:18px;line-height:1.6}
.reader-summary-label{font-size:10px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
#reader-hero{width:100%;max-height:260px;object-fit:cover;border-radius:var(--radius);margin-bottom:18px;display:block}
#reader-body{font-family:var(--font-serif);font-size:16px;line-height:1.75;color:var(--text2)}
#reader-body p{margin-bottom:1em}
#reader-open-link{margin-top:20px;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--accent);text-decoration:none;border:0.5px solid var(--border);border-radius:6px;padding:7px 12px}
.generated-badge{font-size:11px;color:var(--text3);padding:4px 8px;background:var(--bg4);border-radius:4px;white-space:nowrap}
@keyframes spin{to{transform:rotate(360deg)}}
#search-row{padding:5px 12px;border-bottom:0.5px solid var(--border);flex-shrink:0}
#search-input{width:100%;background:var(--bg4);border:0.5px solid var(--border);border-radius:6px;padding:5px 10px;font-size:12.5px;color:var(--text);outline:none;font-family:var(--font)}
#search-input::placeholder{color:var(--text3)}
#search-input:focus{border-color:var(--accent);background:var(--bg3)}
@media(max-width:900px){#sidebar{display:none}#list-pane{width:280px}}
@media(max-width:600px){#list-pane{width:100%;display:flex}#reader-pane{display:none}#list-pane.hidden{display:none}#reader-pane.visible{display:flex;width:100%}#back-btn{display:flex !important}}
#back-btn{display:none}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-scroll">
      <div class="sidebar-section">Smart views</div>
      <div class="nav-item active" data-view="all" data-label="All articles" onclick="selectView(this)"><span>⊞</span> All articles <span class="nav-badge" id="badge-all">—</span></div>
      <div class="nav-item" data-view="unread" data-label="Unread" onclick="selectView(this)"><span>●</span> Unread <span class="nav-badge" id="badge-unread">—</span></div>
      <div class="nav-item" data-view="starred" data-label="Starred" onclick="selectView(this)"><span>★</span> Starred <span class="nav-badge" id="badge-starred">—</span></div>
      <div class="nav-item" data-view="today" data-label="Today" onclick="selectView(this)"><span>◷</span> Today <span class="nav-badge" id="badge-today">—</span></div>
      <div class="sidebar-divider"></div>
      <div id="feed-list"></div>
    </div>
  </div>
  <div id="list-pane">
    <div id="list-toolbar">
      <span id="above-count" onclick="scrollListTop()" title="Scroll to top"></span>
      <span id="list-title">All articles</span>
      <div class="pill-row">
        <div class="pill active" data-filter="all" onclick="setFilter(this)">All</div>
        <div class="pill" data-filter="unread" onclick="setFilter(this)">Unread</div>
        <div class="pill" data-filter="starred" onclick="setFilter(this)">Starred</div>
      </div>
    </div>
    <div id="search-row"><input id="search-input" type="search" placeholder="Search articles…" oninput="onSearch(event)"></div>
    <div id="list-scroll"><div id="list-empty">No articles</div></div>
    <div id="list-keyhints">
      <span class="hint"><kbd>j</kbd><kbd>k</kbd> navigate</span>
      <span class="hint"><kbd>u</kbd> unread</span>
      <span class="hint"><kbd>s</kbd> star</span>
      <span class="hint"><kbd>o</kbd> open</span>
      <span class="hint"><kbd>/</kbd> search</span>
    </div>
  </div>
  <div id="reader-pane">
    <div id="reader-toolbar">
      <button class="icon-btn" id="back-btn" onclick="showList()" title="Back to list">←</button>
      <button class="icon-btn" onclick="nav(-1)">↑</button>
      <button class="icon-btn" onclick="nav(1)">↓</button>
      <div id="reader-toolbar-right">
        <button class="icon-btn" id="btn-star" onclick="toggleStar()">☆</button>
        <button class="icon-btn" id="btn-unread" onclick="toggleUnread()">◎</button>
        <button class="icon-btn" onclick="markAllRead()">✓ All read</button>
        <a class="icon-btn" href="http://127.0.0.1:18789/plugins/rss-digest/refresh" target="_blank" rel="noopener" title="Fetch new articles">↻</a>
      </div>
    </div>
    <div id="reader-scroll">
      <div id="reader-empty">
        <span>Select an article</span>
        <span class="generated-badge" id="gen-badge"></span>
      </div>
      <div id="reader-inner" style="display:none"></div>
    </div>
  </div>
</div>

od_2025\">Comments</a></p>","author":"youtube.com via jbauer","clusterSize":1},{"id":"af3bef7da150cb7a","feedUrl":"https://dev.to/feed/tag/sql","feedTitle":"DEV Community: sql","title":"SQL Week: We Deleted Products, Dropped Tables, and Found Out Which Supplier Was Sitting on the Most Stock","url":"https://dev.to/navas_herbert/sql-week-we-deleted-products-dropped-tables-and-found-out-which-supplier-was-sitting-on-the-most-2e34","publishedAt":1783836896000,"description":"<p>Mama Nia's duka has been running for a few months now.</p> <p>The shelves are stocked. The products are categorised. The suppliers are logged. Everything is in the database - tidy, structured, exactly where it should be.</p> <p>This week I walked into the classroom and told the cohort: <em>\"We're going to start by deleting things.\"</em></p> <p>A few nervous looks. One student - Kamau - actually moved his laptop slightly further away from the edge of the desk, as if SQL could fall off.</p> <p>","author":"Navas Herbert","clusterSize":1},{"id":"0dc6439a92db372d","feedUrl":"https://dev.to/feed/tag/sql","feedTitle":"DEV Community: sql","title":"PostgreSQL 42P08 Error: Causes and Solutions Complete Guide","url":"https://dev.to/dbmserror/postgresql-42p08-error-causes-and-solutions-complete-guide-45g4","publishedAt":1783836174000,"description":"<h2> PostgreSQL Error 42P08: ambiguous parameter </h2> <p>PostgreSQL error code <strong>42P08 <code>ambiguous_parameter</code></strong> occurs when the database engine cannot determine the data type of a parameter placeholder (<code>$1</code>, <code>$2</code>, etc.) in a prepared statement or parameterized query. Because PostgreSQL enforces strict type safety, it rejects any query where a parameter's type cannot be unambiguously resolved from context. This error is commonly encountered when usin","author":"umzzil nng","clusterSize":3},{"id":"35c6a69409e809bb","feedUrl":"https://dev.to/feed/tag/sql","feedTitle":"DEV Community: sql","title":"Oracle ORA-01416 Error: Causes and Solutions Complete Guide","url":"https://dev.to/dbmserror/oracle-ora-01416-error-causes-and-solutions-complete-guide-2dkb","publishedAt":1783836078000,"description":"<h2> ORA-01416: Two Tables Cannot Be Outer-Joined to Each Other </h2> <p>ORA-01416 is an Oracle database error that occurs when a SQL query attempts to apply outer join conditions in both directions between the same two tables simultaneously. In other words, Oracle cannot process a query where Table A is outer-joined to Table B <strong>and</strong> Table B is outer-joined to Table A at the same time. This error is most commonly triggered when using Oracle's legacy <code>(+)</code> outer join ope","author":"umzzil nng","clusterSize":3},{"id":"9a2a9e7ff10a6d27","feedUrl":"https://dev.to/feed/tag/sql","feedTitle":"DEV Community: sql","title":"PostgreSQL 42725 Error: Causes and Solutions Complete Guide","url":"https://dev.to/dbmserror/postgresql-42725-error-causes-and-solutions-complete-guide-195o","publishedAt":1783814590000,"description":"<h2> PostgreSQL Error 42725: Ambiguous Function — Causes and Fixes </h2> <p>PostgreSQL error code <strong>42725 (<code>ambiguous_function</code>)</strong> occurs when the database engine cannot determine which overloaded function to call because multiple candidates are equally valid for the provided arguments. This happens when PostgreSQL's function resolution algorithm finds more than one function with the same name that can accept the given arguments through implicit type casting. The fix almo","author":"umzzil nng","clusterSize":3},{"id":"2509757bf0a25838","feedUrl":"https://dev.to/feed/tag/sql","feedTitle":"DEV Community: sql","title":"Running Ad-Hoc Video Analytics with DuckDB on Parquet Exports","url":"https://dev.to/ahmet_gedik778845/running-ad-hoc-video-analytics-with-duckdb-on-parquet-exports-4mjl","publishedAt":1783832400000,"description":"<h2> The 2 AM query that broke my SQLite habit </h2> <p>Last winter a partner asked me a simple-sounding question: which video categories drove the most watch-through on mobile in India over the previous 90 days, broken down by week, and how did that compare to desktop. On <a href=\"https://dailywatch.video\" rel=\"noopener noreferrer\">DailyWatch</a> our production store is SQLite with FTS5 behind PHP 8.4 and LiteSpeed, and that stack is genuinely great for what it does — full-text discovery, fast ","author":"ahmet gedik","clusterSize":1},{"id":"5a6fcb5a4534aa21","feedUrl":"https://dev.to/feed/tag/sql","feedTitle":"DEV Community: sql","title":"Learning to Think in Sets, Not Loops","url":"https://dev.to/nahamaalochi/learning-to-think-in-sets-not-loops-klp","publishedAt":1783831670000,"description":"<p>SQL is often treated as an implementation detail something to hide behind an ORM or repository layer. That attitude usually survives until the first serious performance incident. At that point, SQL becomes unavoidable.</p> <p>SQL is not just a query language. It is a way of thinking about data that forces clarity.</p> <p>The hardest part of SQL is not syntax, but mindset. SQL requires a shift from imperative thinking to declarative thinking. When developers think in loops, they tend to write ","author":"Edgar Nahama Alochi","clusterSize":1},{"id":"885fe4870ead5f69","feedUrl":"https://lobste.rs/rss","feedTitle":"Lobsters","title":"gap: UI text diff","url":"https://github.com/cdacamar/gap","publishedAt":1783816263000,"description":"<p><a href=\"https://lobste.rs/s/mynquj/gap_ui_text_diff\">Comments</a></p>","author":"github.com via miro","clusterSize":1},{"id":"0f9e2707e31f85f6","feedUrl":"https://lobste.rs/rss","feedTitle":"Lobsters","title":"The accessible contrast ratio colour grid thing","url":"https://beeps.website/blog/2026-07-09-accessible-contrast-ratio-colour-grid-thing/","publishedAt":1783816189000,"description":"<p><a href=\"https://lobste.rs/s/hlokmr/accessible_contrast_ratio_colour_grid\">Comments</a></p>","author":"beeps.website via FedericoSchonborn","clusterSize": ,"url":"https://www.macrumors.com/2026/07/11/top-stories-iphone-ultra-apple-tv-rumors/","publishedAt":1783774810000,"description":"Apple's annual iPhone event is just two months away, but we're still not quite clear on when and in what quantities the new foldable \"iPhone Ultra\" will be available. It sounds like we could end up in a situation similar to that of the iPhone X where it was introduced at the September event but didn't become available for pre-orders until around six weeks later. Other news this week included a third round of developer betas for iOS 27 and related updates, some fresh iPhone 18 Pro rumors, a recap","imageUrl":"images/61b74e82249b30a04378.jpg","author":"MacRumors Staff","clusterSize":1},{"id":"1b2e608f24e82ea5","feedUrl":"https://dev.to/feed/tag/sql","feedTitle":"DEV Community: sql","title":"How to versionar o banco de dados com Flyway sem medo","url":"https://dev.to/isaias_velasquez_d2261770/how-to-versionar-o-banco-de-dados-com-flyway-sem-medo-29io","publishedAt":1783807684000,"description":"<p>Flyway versiona o schema do banco de dados da mesma forma que o Git versiona o codigo fonte. Cada migracao e um arquivo SQL que o Flyway executa na ordem certa.</p> <p>Adicione a dependencia no <code>build.gradle.kts</code>:</p> <div class=\"highlight js-code-highlight\"> <pre class=\"highlight plaintext\"><code>implementation(\"org.flywaydb:flyway-core\") runtimeOnly(\"org.flywaydb:flyway-database-postgresql\") </code></pre> </div> <p>Com Spring Boot, a configuracao e simples:</p> <div class=\"highli","author":"Isaias Velasquez","clusterSize":1},{"id":"9e4f1dbf6230f671","feedUrl":"https://lobste.rs/rss","feedTitle":"Lobsters","title":"RISCBoy RISC-V homebrew portable game console","url":"https://github.com/Wren6991/RISCBoy","publishedAt":1783816199000,"description":"<p><a href=\"https://lobste.rs/s/wsn0hl/riscboy_risc_v_homebrew_portable_game\">Comments</a></p>","author":"github.com via classichasclass","clusterSize":1},{"id":"3ebaaf5f9a517a1d","feedUrl":"http://www.macrumors.com/macrumors.xml","feedTitle":"MacRumors: Mac News and Rumors - Front Page","title":"OpenAI Responds After Being Sued by Apple","url":"https://www.macrumors.com/2026/07/11/openai-responds-after-apple-lawsuit/","publishedAt":1783771046000,"description":"OpenAI has responded after being sued by Apple over alleged theft of the iPhone maker's trade secrets. \"We have no interest in other companies' trade secrets,\" said OpenAI spokesperson Drew Pusateri. \"We remain focused on building innovative technology that empowers people everywhere.\" Tags: Apple Lawsuits , OpenAI This article, \" OpenAI Responds After Being Sued by Apple \" first appeared on MacRumors.com Discuss this article in our forums","imageUrl":"images/668d94e2f7b58184c9a6.jpg","author":"Joe Rossignol","clusterSize":1},{"id":"c5c22acdf138af70","feedUrl":"https://dev.to/feed/tag/sql","feedTitle":"DEV Community: sql","title":"How to criar indices no SQL que realmente fazem diferenca","url":"https://dev.to/isaias_velasquez_d2261770/how-to-criar-indices-no-sql-que-realmente-fazem-diferenca-lp6","publishedAt":1783807660000,"description":"<p>Ter um indice certo pode fazer uma query ir de 10 segundos para milissegundos. Mas indices demais ou errados atrapalham mais que ajudam.</p> <p>O comando basico para criar um indice:</p> <div class=\"highlight js-code-highlight\"> <pre class=\"highlight plaintext\"><code>CREATE INDEX idx_clientes_email ON clientes(email); </code></pre> </div> <p>Isso acelera buscas por <code>email</code>. Sem o indice, o banco faz uma varredura completa na tabela.</p> <p>Para indices compostos (mais de uma coluna","author":"Isaias Velasquez","clusterSize":1},{"id":"788905a377b1031f","feedUrl":"https://dev.to/feed/tag/sql","feedTitle":"DEV Community: sql","title":"How to usar CTEs para consultas SQL mais legiveis","url":"https://dev.to/isaias_velasquez_d2261770/how-to-usar-ctes-para-consultas-sql-mais-legiveis-19d2","publishedAt":1783807631000,"description":"<p>CTEs (Common Table Expressions) tornam consultas SQL mais legiveis ao dividir logicas complexas em blocos nomeados. E como criar variaveis temporarias dentro da query.</p> <p>A sintaxe basica:</p> <div class=\"highlight js-code-highlight\"> <pre class=\"highlight plaintext\"><code>WITH vendas_recentes AS ( SELECT * FROM vendas WHERE data &gt;= '2025-01-01' ) SELECT cliente_id, SUM(valor) as total FROM vendas_recentes GROUP BY cliente_id ORDER BY total DESC; </code></pre> </div> <p>O <code>WITH</c","author":"Isaias Velasquez","clusterSize":2},{"id":"ffb0ff55b13b1bea","feedUrl":"https://dev.to/feed/tag/sql","feedTitle":"DEV Community: sql","title":"How to usar window functions para resolver em uma query","url":"https://dev.to/isaias_velasquez_d2261770/how-to-usar-window-functions-para-resolver-em-uma-query-3ioa","publishedAt":1783807584000,"description":"<p>Window functions resolvem em uma unica query problemas que antes exigiam subconsultas ou joins complicados. Elas calculam valores baseados em um conjunto de linhas relacionadas sem agrupar o resultado.</p> <p>A sintaxe basica com <code>ROW_NUMBER</code>:</p> <div class=\"highlight js-code-highlight\"> <pre class=\"highlight plaintext\"><code>SELECT nome, departamento, salario, ROW_NUMBER() OVER (PARTITION BY departamento ORDER BY salario DESC) as posicao FROM funcionarios; </code></pre> </div> <p","author":"Isaias Velasquez","clusterSize":2},{"id":"644c3d2d1bbab6c9","feedUrl":"https://dev.to/feed/tag/sql","feedTitle":"DEV Community: sql","title":"SQLite Puzzler, DuckCon #7 Program, and PostgreSQL `enable_seqscan` Deep Dive","url":"https://dev.to/soytuber/sqlite-puzzler-duckcon-7-program-and-postgresql-enableseqscan-deep-dive-1cj","publishedAt":1783805709000,"description":"<h2> SQLite Puzzler, DuckCon #7 Program, and PostgreSQL <code>enable_seqscan</code> Deep Dive </h2> <h3> Today's Highlights </h3> <p>This week's highlights include a challenging SQLite SQL puzzler on efficient min/max aggregation, the program announcement for DuckCon #7, and a practical dive into PostgreSQL's <code>enable_seqscan</code> GUC for performance tuning.</p> <h2> A Weekend Puzzler: Efficient min/max in SQLite Parent/Child Relationships (SQLite Forum) </h2> <p>Source: <a href=\"https://s","author":"soy","clusterSize":1},{"id":"762292e4949ba5f3","feedUrl":"http://feeds.feedburner.com/highsnobiety/rss","feedTitle":"Behold, Beautiful Birken-Crocs","title":"Behold, Beautiful Birken-Crocs","url":"https://www.highsnobiety.com/p/crocs-loaferette-clogs/","publishedAt":1783802543000,"description":"The Crocs Loaferette clog lands as a new slip-on shoe featuring buckled straps & sleek view. It's like Birken-Crocs!","clusterSize":1},{"id":"73adf4cab761aef7","feedUrl":"https://daringfireball.net/feeds/main","feedTitle":"Daring Fireball","title":"Can Someone Explain to Me How to Get ‘ChatGPT Classic’?","url":"https://help.openai.com/en/articles/20001276-moving-to-the-new-chatgpt-desktop-app","publishedAt":1783809519000,"description":"One more link from OpenAI’s Help Center, this one explaining how to upgrade from the old Mac app to the new “super” app version: Follow the prompt in the app to download the new ChatGPT desktop app. Then sign in with the same ChatGPT account. The new app may install alongside your current app. If both remain installed, you will see: ChatGPT : The new app with Chat, Work, and Codex. ChatGPT Classic : The previous ChatGPT desktop app. You can continue using it; no migration is required at launch. ","author":"John Gruber","clusterSize":1},{"id":"62d9c6e0c998f0f2","feedUrl":"http://feeds.feedburner.com/highsnobiety/rss","feedTitle":"Behold, Beautiful Birken-Crocs","title":"You Can Now Run Trails in Crocs","url":"https://www.highsnobiety.com/p/crocs-classic-exp-clog-gum/","publishedAt":1783800540000,"description":"Crocs is pushing its design language even further into the rugged, outdoors-driven universe with the The Crocs Classic EXP Clog.","clusterSize":1},{"id":"024d21f2493c576b","f   if (state.feedUrl) list = list.filter(a=>a.feedUrl===state.feedUrl);
  const now = Date.now(), todayCutoff = now - 86400000;
  if (state.view==='unread') list=list.filter(a=>!isRead(a.id));
  else if (state.view==='starred') list=list.filter(a=>isStarred(a.id));
  else if (state.view==='today') list=list.filter(a=>(a.publishedAt||0)>=todayCutoff);
  if (state.filter==='unread') list=list.filter(a=>!isRead(a.id));
  else if (state.filter==='starred') list=list.filter(a=>isStarred(a.id));
  if (state.search) {
    const q = state.search.toLowerCase();
    list = list.filter(a => a.title.toLowerCase().includes(q) || a.feedTitle.toLowerCase().includes(q) || (a.description||'').toLowerCase().includes(q));
  }
  list.sort((a,b)=>(b.publishedAt||0)-(a.publishedAt||0));
  state.visible = list;
  renderList();
}

const PAGE_SIZE = 50;
let listPage = 1;

function renderList() {
  listPage = 1;
  if (_observer) { _observer.disconnect(); _observer = null; }
  renderListPage(true);
}

function renderListPage(reset) {
  const scroll = document.getElementById('list-scroll');
  const empty = document.getElementById('list-empty');
  if (reset) scroll.querySelectorAll('.article-row,#scroll-sentinel').forEach(e=>e.remove());
  const batch = reset
    ? state.visible.slice(0, listPage * PAGE_SIZE)
    : state.visible.slice((listPage - 1) * PAGE_SIZE, listPage * PAGE_SIZE);
  if (reset && batch.length === 0) { empty.style.display='block'; return; }
  empty.style.display='none';
  const frag = document.createDocumentFragment();
  for (const a of batch) {
    const div = document.createElement('div');
    div.className='article-row'+(isRead(a.id)?' read':'')+(a.id===state.selected?' selected':'');
    div.dataset.id=a.id;
    div.innerHTML='<div class="row-content"><div class="row-top"><div class="unread-dot"></div><div class="row-feed">'+esc(a.feedTitle)+'</div><div class="row-date">'+relTime(a.publishedAt)+'</div></div>'
      +'<div class="row-title">'+esc(a.title)+(a.clusterSize>1?'<span class="cluster-badge">'+a.clusterSize+' sources</span>':'')+'</div>'
      +(a.description?'<div class="row-desc">'+esc(a.description)+'</div>':'')+'</div>'
      +(a.imageUrl?'<img class="row-thumb" src="'+esc(a.imageUrl)+'" alt="" loading="lazy" onerror="this.remove()">':'');
    div.onclick=()=>open(a.id);
    frag.appendChild(div);
  }
  // Remove old sentinel before appending new rows
  scroll.querySelector('#scroll-sentinel')?.remove();
  scroll.appendChild(frag);
  if (reset && !_bootRestored) { _bootRestored = true; restoreScrollAnchor(); }
  // Attach infinite-scroll sentinel if more pages remain
  if (state.visible.length > listPage * PAGE_SIZE) {
    const sentinel = document.createElement('div');
    sentinel.id = 'scroll-sentinel';
    sentinel.style.height = '1px';
    scroll.appendChild(sentinel);
    if (_observer) _observer.disconnect();
    _observer = new IntersectionObserver(([e]) => {
      if (!e.isIntersecting || _loadingMore) return;
      _loadingMore = true;
      listPage++;
      renderListPage(false);
      _loadingMore = false;
    }, { root: scroll, rootMargin: '400px' });
    _observer.observe(sentinel);
  }
}

function updateAboveCount() {
  const sc = document.getElementById('list-scroll');
  const el = document.getElementById('above-count');
  if (!sc || !el) return;
  const top = sc.getBoundingClientRect().top;
  let count = 0;
  for (const row of sc.querySelectorAll('.article-row')) {
    if (row.getBoundingClientRect().bottom < top) count++;
    else break;
  }
  el.textContent = count > 0 ? '↑ ' + count : '';
  el.classList.toggle('visible', count > 0);
}

function scrollListTop() {
  document.getElementById('list-scroll').scrollTo({ top: 0, behavior: 'smooth' });
}

function open(id) {
  document.getElementById('list-pane').classList.add('hidden');
  document.getElementById('reader-pane').classList.add('visible');
  state.selected = id;
  document.querySelectorAll('.article-row').forEach(r=>r.classList.toggle('selected',r.dataset.id===id));
  const row=document.querySelector('.article-row[data-id="'+id+'"]');
  if (row) row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  if (!isRead(id)) {
    setRead(id,true);
    if (row) row.classList.add('read');
    renderSidebar();
  }
  saveScrollAnchor(id);
  const a = ALL_ARTICLES.find(x=>x.id===id);
  if (a) renderReader(a);
}

function renderReader(a) {
  document.getElementById('btn-star').textContent = isStarred(a.id)?'★':'☆';
  document.getElementById('btn-star').classList.toggle('on',isStarred(a.id));
  let html='<div class="reader-meta"><span class="reader-feed-badge">'+esc(a.feedTitle)+'</span><span>'+relTime(a.publishedAt)+'</span></div>';
  html+='<div id="reader-title">'+esc(a.title)+'</div>';
  if (a.ollamaSummary) html+='<div class="reader-summary-block"><div class="reader-summary-label">AI summary</div>'+esc(a.ollamaSummary)+'</div>';
  if (a.imageUrl) html+='<img id="reader-hero" src="'+esc(a.imageUrl)+'" alt="" onerror="this.remove()">';
  if (a.description) html+='<div id="reader-body"><p>'+esc(a.description)+'</p></div>';
  html+='<a id="reader-open-link" href="'+esc(a.url)+'" target="_blank" rel="noopener">Open original ↗</a>';
  document.getElementById('reader-empty').style.display='none';
  const inner=document.getElementById('reader-inner');
  inner.innerHTML=html; inner.style.display='block';
  document.getElementById('reader-scroll').scrollTop=0;
}

function nav(dir) {
  const idx=state.visible.findIndex(a=>a.id===state.selected);
  const next=state.visible[idx+dir];
  if (next) open(next.id);
}
function toggleStar() {
  const a=ALL_ARTICLES.find(x=>x.id===state.selected); if(!a) return;
  setStar(a.id,!isStarred(a.id));
  document.getElementById('btn-star').textContent=isStarred(a.id)?'★':'☆';
  document.getElementById('btn-star').classList.toggle('on',isStarred(a.id));
  renderSidebar();
}
function toggleUnread() {
  if(!state.selected) return;
  const wasRead=isRead(state.selected);
  setRead(state.selected,!wasRead);
  const row=document.querySelector('.article-row[data-id="'+state.selected+'"]');
  if(row) row.classList.toggle('read',!wasRead);
  renderSidebar();
}
function markAllRead() {
  for (const a of state.visible) setRead(a.id,true);
  document.querySelectorAll('.article-row').forEach(r=>r.classList.add('read'));
  renderSidebar();
}
function showList() {
  document.getElementById('list-pane').classList.remove('hidden');
  document.getElementById('reader-pane').classList.remove('visible');
}

document.addEventListener('keydown', e=>{
  if (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if(e.key==='j') nav(1);
  else if(e.key==='k') nav(-1);
  else if(e.key==='u') toggleUnread();
  else if(e.key==='s') toggleStar();
  else if(e.key==='Escape') { if(isMobile()) showList(); }
  else if(e.key==='/') { e.preventDefault(); const si=document.getElementById('search-input'); if(si){si.focus();si.select();} }
  else if(e.key==='o'&&state.selected) {
    const a=ALL_ARTICLES.find(x=>x.id===state.selected);
    if(a) window.open(a.url,'_blank','noopener');
  }
});

boot();
</script>
</body>
</html>
